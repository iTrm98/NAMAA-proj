; NAMAA sensor node (soil, DHT, flow, water level, relay, LCD).
;
;   pio run -e esp32               classic ESP32-WROOM-32 DevKit
;   pio run -e esp32s3             ESP32-S3-DevKitC-1 N16R8 (octal PSRAM)
;   pio run -e esp32 -t upload     flash (add -t monitor to watch the serial port)
;   pio test -e native             unit tests of the hardware-free logic, on this computer
;
; Features and pins live in include/config.h. Any of them can be overridden per
; env with build_flags, e.g. -DFEATURE_FLOW=0 or -DPIN_RELAY=23.
; Wi-Fi, server and node token: include/secrets.h (copy of secrets.h.example,
; git-ignored), changeable at run time over serial (type `help`).

[platformio]
default_envs = esp32, esp32s3

[common]
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.0
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
build_flags =
  -DFW_VERSION=\"namaa-sensor-4.0.0\"
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:esp32]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
upload_speed = 921600

[env:esp32s3]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi   ; N16R8: quad flash, octal PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps = ${common.lib_deps}
; USB CDC on boot: logs and serial commands use the port marked "USB" (native USB).
; Set ARDUINO_USB_CDC_ON_BOOT=0 to use the port marked "UART"/"COM" instead.
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}

[env:native]
; Host unit tests for lib/namaa_core (no Arduino). Needs gcc/g++ on PATH.
platform = native
test_framework = unity
lib_deps = bblanchon/ArduinoJson @ ^7.2.0
build_flags = -std=gnu++17
