# NAMAA development stack.
#
# Every host port, credential and URL comes from the root .env
# (copy .env.example to .env). See README.md for first-time setup.
#
# Services: mysql, backend (Laravel API), reverb (WebSockets), scheduler,
# queue, vision (Python).
#
# The React dashboard is NOT in Docker: it runs on the host with Node
# (npm run dev in frontend/). See README.md.

name: namaa

x-laravel-env: &laravel-env
  APP_NAME: ${APP_NAME:-NAMAA}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_KEY: ${APP_KEY:-}
  APP_URL: http://localhost:${BACKEND_HOST_PORT:-8000}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-namaa}
  DB_USERNAME: ${DB_USERNAME:-namaa}
  DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
  BROADCAST_CONNECTION: reverb
  QUEUE_CONNECTION: database
  REVERB_APP_ID: ${REVERB_APP_ID:?Copy .env.example to .env and set REVERB_APP_ID}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?Copy .env.example to .env and set REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Copy .env.example to .env and set REVERB_APP_SECRET}
  # Laravel talks to Reverb over the internal Docker network.
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8080
  VISION_SERVICE_URL: http://vision:8001
  # Camera node (ESP32-S3-CAM running CameraWebServer). Laravel fetches photos from it.
  CAMERA_URL: ${CAMERA_URL:-}
  # Shared password of the seeded demo accounts (php artisan db:seed).
  DEMO_PASSWORD: ${DEMO_PASSWORD:-password}
  # true = boards report every 5 s instead of 30 s (sent as interval_s).
  DEMO_MODE: ${DEMO_MODE:-false}

x-laravel: &laravel
  build: ./backend
  volumes:
    - ./backend:/var/www/html
    # Seed and recorded demo data (data/seed/parks.json), read-only.
    - ./data:/var/www/data:ro
    # Park selection file and OSM exports are written by the backend (read-write over the read-only mount).
    - ./data/parks:/var/www/data/parks
  environment:
    <<: *laravel-env
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-namaa}
      MYSQL_USER: ${DB_USERNAME:-namaa}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    ports:
      # Local access only (DB client). Containers use mysql:3306 internally.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    <<: *laravel
    # --no-reload: without it, artisan serve drops the Docker environment
    # (DB_CONNECTION=mysql, ...) for every key that also exists in backend/.env,
    # and ignores PHP_CLI_SERVER_WORKERS. Restart the container after editing .env.
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    restart: unless-stopped
    environment:
      <<: *laravel-env
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      # Open to the network: the ESP32 nodes post their readings here.
      - "${BACKEND_HOST_PORT:-8000}:8000"

  reverb:
    <<: *laravel
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    ports:
      - "${REVERB_HOST_PORT:-8080}:8080"

  scheduler:
    <<: *laravel
    # schedule:clear-cache drops the withoutOverlapping locks a killed scheduler left behind;
    # without it a restart skips the simulator for up to 2 minutes.
    command: sh -c "php artisan schedule:clear-cache && exec php artisan schedule:work"
    restart: unless-stopped

  queue:
    <<: *laravel
    command: php artisan queue:work --tries=1
    restart: unless-stopped

  vision:
    build: ./vision-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload --log-level ${VISION_LOG_LEVEL:-info}
    restart: unless-stopped
    volumes:
      - ./vision-service:/srv
      - ./data:/data
    ports:
      # Local access only (debugging). Laravel reaches it at http://vision:8001.
      - "127.0.0.1:${VISION_HOST_PORT:-8001}:8001"

volumes:
  mysql_data:
